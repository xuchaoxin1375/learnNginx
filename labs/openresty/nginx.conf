worker_processes auto;

error_log /usr/local/openresty/nginx/logs/error.log notice;
pid       /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/json;

    lua_shared_dict counters 1m;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /lua/hello {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                ngx.say(cjson.encode({
                    message = "hello from OpenResty",
                    host = ngx.var.host,
                    time = ngx.now()
                }))
            }
        }

        location = /lua/counter {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local dict = ngx.shared.counters
                local hits, err = dict:incr("hits", 1, 0)
                if not hits then
                    ngx.log(ngx.ERR, "shared dict incr failed: ", err)
                    return ngx.exit(500)
                end
                ngx.say(cjson.encode({ hits = hits }))
            }
        }

        location = /lua/headers {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local headers = ngx.req.get_headers()
                ngx.say(cjson.encode({ headers = headers }))
            }
        }

        location = /lua/echo {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local args = ngx.req.get_uri_args()
                ngx.say(cjson.encode({ args = args }))
            }
        }

        location = /lua/ab {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local dict = ngx.shared.counters
                local count = dict:incr("ab_counter", 1, 0)
                local variant = (count % 2 == 0) and "A" or "B"
                ngx.say(cjson.encode({ variant = variant, count = count }))
            }
        }

        location / {
            default_type text/plain;
            return 200 "OpenResty lab. Try /lua/hello, /lua/counter, /lua/headers, /lua/echo, /lua/ab.\n";
        }
    }
}
