# 默认轮询。想观察最少连接数，改成 least_conn 后重新加载。
upstream api_backend {
    server api1:8000 max_fails=2 fail_timeout=10s;
    server api2:8000 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=100m inactive=10m use_temp_path=off;

server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 只允许本机和私有网段读取；如果从宿主机访问返回 403，先看 access.log 里的真实来源地址。
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # 限速：平均 5 请求/秒，允许突发 3 个，超出立即返回 429。
    location = /api/limited {
        limit_req zone=api_limit burst=3 nodelay;
        limit_req_status 429;
        limit_conn api_conn 5;
        limit_conn_status 429;
        proxy_pass http://api1:8000/limited;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # 微缓存：200 响应缓存 2 秒。X-Cache-Status 便于观察 MISS/HIT。
    location = /api/cache-test {
        proxy_cache api_cache;
        proxy_cache_valid 200 2s;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://api1:8000/cache-test;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/ {
        proxy_pass http://api_backend/;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        proxy_intercept_errors on;
    }

    location / {
        default_type text/plain;
        return 200 "Load balancing lab. Try /api/, /api/limited, /api/cache-test, /nginx_status.\n";
    }

    location = /50x.html {
        internal;
    }

    error_page 502 504 /50x.html;
}
