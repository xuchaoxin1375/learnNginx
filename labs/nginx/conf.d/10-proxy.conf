server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/users -> http://api1:8000/users
    location /api/ {
        proxy_pass http://api1:8000/;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
    }

    # 故意制造 504：上游睡 5 秒，nginx 只等 1 秒。
    location = /api/slow-timeout {
        proxy_pass http://api1:8000/slow?ms=5000;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 1s;
    }

    # 流式响应：关闭缓冲，否则 nginx 可能攒满缓冲区才发给客户端。
    location = /api/stream {
        proxy_pass http://api1:8000/stream;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }

    error_page 404 /404.html;
    error_page 502 504 /50x.html;
}
