server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 精确匹配：只有 /match/exact 会命中。
    location = /match/exact {
        default_type text/plain;
        return 200 "exact match\n";
    }

    # 普通前缀匹配。
    location /match/prefix/ {
        default_type text/plain;
        return 200 "prefix match\n";
    }

    # 更长的前缀，但普通前缀不会跳过正则检查。
    location /match/prefix/deep/ {
        default_type text/plain;
        return 200 "longer prefix match\n";
    }

    # 正则匹配会优先于上面记住的普通前缀。
    location ~ ^/match/prefix/deep/[0-9]+$ {
        default_type text/plain;
        return 200 "regex match\n";
    }

    # 变量观察：对比 $uri、$request_uri、$args 和 Host。
    location = /vars {
        default_type text/plain;
        return 200 "uri=$uri\nrequest_uri=$request_uri\nargs=$args\nhost=$host\nhttp_host=$http_host\nscheme=$scheme\n";
    }

    # alias 演示。^~ 让这个前缀跳过后面的正则匹配。
    location ^~ /static/ {
        alias /usr/share/nginx/html/assets/;
    }

    # 单页应用回退：文件不存在时交给前端路由。
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # 旧地址跳转。
    location = /legacy {
        return 301 /match/exact;
    }

    # 演示 HTTP 到 HTTPS 的跳转；端口与 compose 中的发布端口一致。
    location = /https-redirect {
        return 301 https://$host:8443/;
    }

    # 隐藏文件默认拒绝。生产环境若要签发证书，需要为 ACME 放行 .well-known。
    # 这个正则必须放在静态资源正则之前，否则 /.secret.css 会先命中资源规则。
    location ~ /\. {
        deny all;
    }

    # 静态资源缓存。这里不使用 add_header，避免覆盖 server 级安全响应头。
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|woff2?)$ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}
